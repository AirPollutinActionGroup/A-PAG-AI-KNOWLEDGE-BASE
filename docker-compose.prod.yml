# Production / shared-host compose file for the A-PAG AI Knowledge Base.
#
# Deliberately a STANDALONE file, not an override of docker-compose.yml. Compose merges
# `ports` by appending, so an override cannot *remove* a published port — and the entire
# point of this file is that Postgres (5432) and MinIO (9000/9001) must NOT be reachable
# from outside the host. Keeping it standalone means what you read here is exactly what runs.
#
# Differences from the local docker-compose.yml:
#   1. No published ports for postgres/minio — they exist only on the internal bridge network.
#   2. Every credential comes from the environment (a .env file beside this one), never
#      hardcoded. docker-compose.yml has the dev password inline, which is in git.
#   3. A one-shot `migrate` service runs `alembic upgrade head` and exits; api and worker
#      refuse to start until it completes successfully. So bringing the stack up is one
#      command with no separate migration step.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required in .env (see .env.example):
#   POSTGRES_PASSWORD, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, JWT_SECRET_KEY

services:
  postgres:
    image: paradedb/paradedb:0.25.10-pg16
    # pg_search must be in shared_preload_libraries; it refuses to CREATE EXTENSION otherwise.
    # ParadeDB's image sets this when it initialises a fresh data directory — but ours was
    # initialised by the pgvector image it replaces, so that init never ran and the existing
    # postgresql.conf has no such line. Passing it as a flag is what makes the swap work on an
    # existing volume rather than only on a clean one.
    command: postgres -c shared_preload_libraries=pg_search
    container_name: apag-postgres
    # Bound to the VM's loopback only (127.0.0.1), not 0.0.0.0 — reachable from the public
    # internet under neither address, but an operator can still SSH-tunnel in
    # (`ssh -L 15432:localhost:5432 ...`) to inspect data with a GUI client, since the
    # tunnel's far end lands on the VM's own loopback, not the internal Docker network.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apag_knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # MinIO removed minio/minio from Docker Hub in Sept 2026 (anonymous pulls now 401).
    # quay.io/minio/minio is their current official distribution — same image, same tags.
    image: quay.io/minio/minio:latest
    container_name: apag-minio
    # Console bound to the VM's loopback only, same reasoning as postgres above: closed to
    # the internet, reachable via `ssh -L 9001:localhost:9001 ...` for the visual browser.
    # The S3 API port (9000) stays unpublished — only the api/worker containers use it,
    # over the internal Docker network, and never need it from outside the VM.
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot schema migration. Runs to completion then exits; api/worker gate on it via
  # `service_completed_successfully`, so there is no window where the app serves requests
  # against a schema that hasn't been migrated yet.
  migrate:
    build: .
    container_name: apag-migrate
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: apag-api
    command: python main.py
    # Published on 85, not 8000: A-PAG's network only permits outbound traffic to this host
    # on port 85, so that is the only port reachable from the office network. uvicorn still
    # listens on 8000 inside the container — Docker maps the privileged host port for us,
    # so nothing in the application needs to know about this.
    ports:
      - "85:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      ENVIRONMENT: staging
      # Written answers. Interpolated with an empty default so the stack still starts without
      # a key: /ask then returns 503 and the UI falls back to showing passages, which is the
      # intended behaviour for a deployment without external inference rather than a crash.
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_MODEL: ${SARVAM_MODEL:-sarvam-105b-conversations}
      # Reranking is where most of the retrieval quality comes from (83% vs 80% first-result
      # accuracy, 97% vs 91% in the top five, measured) and it is also the only per-query CPU
      # cost. Set RERANK_ENABLED=false in .env if this VM cannot afford ~2s a question.
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      # Passed through explicitly because this service lists its environment rather than reading
      # .env wholesale: a RERANK_CANDIDATES line in .env reached nothing until this was added, so
      # DEPLOY.md's advice to lower it on a 2-vCPU VM silently did not apply. 25 costs one point
      # of first-result accuracy and two in the top five for ~1.8x the speed (measured).
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-50}
      INFERENCE_THREADS: ${INFERENCE_THREADS:-0}
      # Shared demo login shown under the sign-in box. Empty (the default) hides it.
      DEMO_LOGIN_EMAIL: ${DEMO_LOGIN_EMAIL:-}
      DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:-}
      # Google Drive connector. Carried by the api service because `drive_sync.py` is run
      # through it (`docker compose exec api python drive_sync.py`) -- this container already
      # has the database, MinIO and the format registry, which is everything the import needs.
      # Forwarded explicitly for the same reason RERANK_CANDIDATES is: this service lists its
      # environment rather than reading .env wholesale, so a line in .env reaches nothing
      # unless it appears here.
      GDRIVE_ENABLED: ${GDRIVE_ENABLED:-false}
      GDRIVE_CREDENTIALS_FILE: ${GDRIVE_CREDENTIALS_FILE:-/app/secrets/drive-sync.json}
      GDRIVE_PUBLIC_FOLDER_ID: ${GDRIVE_PUBLIC_FOLDER_ID:-}
      GDRIVE_RESTRICTED_FOLDER_ID: ${GDRIVE_RESTRICTED_FOLDER_ID:-}
      GDRIVE_FALLBACK_OWNER_EMAIL: ${GDRIVE_FALLBACK_OWNER_EMAIL:-}
    # The service-account key, mounted read-only and never baked into the image: a credential in
    # a layer is a credential in every copy of that image. `:ro` is not decoration -- nothing in
    # this deployment has any reason to write to it.
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # One worker process per pipeline stage. The container healthcheck watches a single heartbeat
  # file, which assumes one worker daemon per container (KNOWN_DEBTS.md #5) — so each stage gets
  # its own container off the same image, selected by WORKER_STAGE, rather than threads in one.
  worker:
    build: .
    container_name: apag-worker
    command: python worker_main.py
    environment:
      WORKER_STAGE: SCAN
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: staging
      WORKER_POLL_INTERVAL_SECONDS: "1.0"
      SCAN_WORKER_LEASE_SECONDS: "60"
      WORKER_HEARTBEAT_FILE: "/tmp/worker_alive"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker_alive) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  normalization-worker:
    build: .
    container_name: apag-normalization-worker
    command: python worker_main.py
    environment:
      WORKER_STAGE: NORMALIZE
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: staging
      WORKER_POLL_INTERVAL_SECONDS: "1.0"
      SCAN_WORKER_LEASE_SECONDS: "60"
      WORKER_HEARTBEAT_FILE: "/tmp/worker_alive"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker_alive) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  chunking-worker:
    build: .
    container_name: apag-chunking-worker
    # The chunking worker now loads the embedding model purely to tokenize, so chunk sizes are
    # measured in the unit that actually constrains the next stage. ~640MB resident for a stage
    # that does no inference — the trade-off is recorded in KNOWN_DEBTS.md #32, along with the
    # lighter alternative (loading the tokenizer alone) and why it was not taken.
    mem_limit: 1800m
    command: python worker_main.py
    environment:
      WORKER_STAGE: CHUNK
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: staging
      WORKER_POLL_INTERVAL_SECONDS: "1.0"
      SCAN_WORKER_LEASE_SECONDS: "60"
      WORKER_HEARTBEAT_FILE: "/tmp/worker_alive"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker_alive) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  embedding-worker:
    build: .
    container_name: apag-embedding-worker
    # Holds the ONNX model plus the allocator arena, which grows with the number of inference
    # calls a single document costs and is never returned. Measured at INFERENCE_THREADS=2 on the
    # real corpus:
    #
    #   model loaded, idle        527MB
    #   after   160 chunks      1,455MB   (+772MB)
    #   after 1,815 chunks      2,537MB   (+1,082MB for 11x the chunks)
    #
    # The growth is **sublinear** -- the arena plateaus rather than scaling with document size --
    # so the fix is headroom, not a batching rewrite: holding fewer vectors in Python would save
    # ~45MB of the ~2GB. 3g leaves real room on an 8GB VM where only this worker is heavy; at the
    # previous 2500m the 1,815-chunk spreadsheet fit with 3% to spare, which is not a margin.
    #
    # Docker does not kill a container over this limit while swap exists, it swaps it: ~1.1GB of
    # the worker was once paged out and embedding crawled with no error in any log. A limit that
    # is merely close enough therefore looks like a hang, not a failure.
    #
    # Thread count is nearly irrelevant to memory (1,455MB at 2 threads vs 1,548MB at 8 on the
    # same 160 chunks) but is everything to speed: 1.6 chunks/s against 3.1.
    mem_limit: ${EMBEDDING_MEM_LIMIT:-3g}
    command: python worker_main.py
    environment:
      WORKER_STAGE: EMBED
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      INFERENCE_THREADS: ${INFERENCE_THREADS:-0}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: staging
      WORKER_POLL_INTERVAL_SECONDS: "1.0"
      SCAN_WORKER_LEASE_SECONDS: "60"
      WORKER_HEARTBEAT_FILE: "/tmp/worker_alive"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker_alive) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  extraction-worker:
    build: .
    container_name: apag-extraction-worker
    # The VM this targets has 3.8GB of RAM in total, shared with Postgres, MinIO, the API and
    # four other workers. Extraction is the memory-hungry stage: pdfplumber holds page objects for
    # the document it parses, and a 1,351-page PDF peaked at 3.6GB on a developer machine — more
    # than this whole host. MAX_PDF_PAGES below rejects such a document with a reason, which is
    # strictly better than the alternative: an OOM kill is not a PermanentProcessingError, so the
    # container dies, the lease lapses, the reaper re-queues, and the next worker dies on the same
    # document. See KNOWN_DEBTS.md #24.
    mem_limit: 1800m
    # Optional ceiling on how much CPU OCR may take. 0 (the default) means no limit, so nothing
    # changes until it is set. On a 2-vCPU VM a large scanned PDF otherwise takes both cores for
    # the length of the job and search slows for everyone; EXTRACTION_CPUS=1.5 leaves half a core
    # for the API and Postgres at the price of slower OCR. Untested against real load, which is
    # why it is opt-in: measure a question's latency during an OCR ingest before relying on it.
    cpus: ${EXTRACTION_CPUS:-0}
    command: python worker_main.py
    environment:
      WORKER_STAGE: EXTRACT
      MAX_PDF_PAGES: "600"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # OCR for scanned PDFs. Thread count is not a tuning detail: left at the onnxruntime
      # default these pages measured 20.5s each against 3.5s at 8 intra-op threads. Set it to
      # the VM's core count, not this machine's — 8 threads on a 2-vCPU box is slower than 2.
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_THREADS: ${OCR_THREADS:-0}
      ENVIRONMENT: staging
      WORKER_POLL_INTERVAL_SECONDS: "1.0"
      SCAN_WORKER_LEASE_SECONDS: "60"
      WORKER_HEARTBEAT_FILE: "/tmp/worker_alive"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker_alive) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
