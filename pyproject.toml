[project]
name = "apag-ai-knowledge-base"
version = "0.1.0"
description = "A-PAG AI Knowledge Base Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.1.0",
    # Phase 4 text extraction. Deliberately non-ML for typed documents: Office formats carry
    # their own structure in XML and a typed PDF carries a real text layer, so there is nothing
    # for layout inference to recover.
    #
    # That held until the corpus disagreed. Three of A-PAG's first 39 documents are scans with
    # no text layer at all, so `rapidocr` below reads those pages from pixels. Docling and
    # unstructured were re-evaluated at that point and still rejected: they recover *layout*,
    # which earns its weight on scanned tables, and measured on these scans (pages sampled
    # across the 162-page set, counting detected lines that share a horizontal band) there are
    # no tables — they are prose notifications. Their cost is ~500MB of models plus
    # torch/transformers, in an image that already carries a 640MB embedding model. LlamaParse
    # is a cloud API, which would send every document out of the deployment at ingestion.
    # See KNOWN_DEBTS.md for the trigger to revisit — scanned tables would be it, and Docling
    # takes RapidOCR as its own OCR backend, so this is a layer under that, not a dead end.
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    # Language detection for normalization. Chosen over fasttext-based alternatives because it
    # ships its language profiles inside the package — those download a model on first use, which
    # inside a worker container means a network fetch at runtime that can fail or stall a cold
    # start. Whole documents give it plenty of text to work with, which is where it is accurate.
    "langdetect>=1.0.9",
    "minio>=7.2.5",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pytest>=8.0.0",
    # Integration tests MUST get a throwaway Postgres. Without this installed,
    # tests/integration/conftest.py falls back to the dev DATABASE_URL and the
    # worker tests' table-wide DELETEs destroy real development data.
    "testcontainers[postgres]>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "slowapi>=0.1.9",
    "pydantic[email]>=2.6.0",
    "fastembed>=0.4.0",
    "pgvector>=0.3.0",
    # OCR for scanned PDF pages. Runs on onnxruntime, which fastembed already puts in this
    # image, so this adds models and OpenCV rather than a second inference runtime — and no
    # PyTorch, consistent with every other model choice here. Rasterisation needs nothing new:
    # pdfplumber already depends on pypdfium2 and `page.to_image()` uses it.
    "rapidocr>=3.4,<4",
    # Google Drive connector. `google-auth` only: it signs the service-account JWT and refreshes
    # the access token, which is the part worth not hand-rolling. Drive itself is plain REST and
    # is called with the httpx already above, so `google-api-python-client` — which pulls its own
    # HTTP stack, a discovery-document cache and protobuf — is deliberately not here.
    "google-auth>=2.30,<3",
]

[project.optional-dependencies]
# Answer-quality evaluation. **Never imported by the application** — `run_ragas.py` only, run
# offline and by hand. That distinction is the whole reason this is an extra rather than a
# dependency: ragas pulls LangChain and the OpenAI client, and the runtime deliberately has
# neither. `pip install .` gives you the service; `pip install .[eval]` gives you the harness.
#
# langchain-community is pinned below 0.4 because ragas 0.4.3 imports
# `langchain_community.chat_models.vertexai` at module load, and 0.4 removed it — the package
# is being sunset. Raise this pin only after checking that import still resolves.
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "main.py"]
extraPaths = ["."]

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
