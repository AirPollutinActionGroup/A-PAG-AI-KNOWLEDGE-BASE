services:
  postgres:
    image: postgres:16-alpine
    container_name: apag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: apag_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apag_knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: apag-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: apag_admin
      MINIO_ROOT_PASSWORD: apag_secure_password_2026
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
