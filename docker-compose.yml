services:
  postgres:
    image: postgres:16-alpine
    container_name: apag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: apag_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apag_knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    # MinIO removed minio/minio from Docker Hub in Sept 2026 (anonymous pulls now 401).
    # quay.io/minio/minio is their current official distribution — same image, same tags.
    image: quay.io/minio/minio:latest
    container_name: apag-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: apag_admin
      MINIO_ROOT_PASSWORD: apag_secure_password_2026
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    container_name: apag-api
    command: python main.py
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:apag_secure_password_2026@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: apag_secure_password_2026
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: apag_admin
      MINIO_SECRET_KEY: apag_secure_password_2026
      MINIO_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # One worker process per pipeline stage — the healthcheck model assumes a single worker daemon
  # per container (KNOWN_DEBTS.md #5), so stages get their own containers off the same image
  # rather than threads inside one. WORKER_STAGE picks which BaseWorker subclass runs.
  worker:
    build: .
    container_name: apag-worker
    command: python worker_main.py
    environment:
      WORKER_STAGE: SCAN
      DATABASE_URL: postgresql://postgres:apag_secure_password_2026@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: apag_secure_password_2026
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: apag_admin
      MINIO_SECRET_KEY: apag_secure_password_2026
      MINIO_SECURE: "false"
      WORKER_POLL_INTERVAL_SECONDS: "1.0"
      SCAN_WORKER_LEASE_SECONDS: "60"
      WORKER_HEARTBEAT_FILE: "/tmp/worker_alive"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker_alive) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  normalization-worker:
    build: .
    container_name: apag-normalization-worker
    command: python worker_main.py
    environment:
      WORKER_STAGE: NORMALIZE
      DATABASE_URL: postgresql://postgres:apag_secure_password_2026@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: apag_secure_password_2026
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: apag_admin
      MINIO_SECRET_KEY: apag_secure_password_2026
      MINIO_SECURE: "false"
      WORKER_POLL_INTERVAL_SECONDS: "1.0"
      SCAN_WORKER_LEASE_SECONDS: "60"
      WORKER_HEARTBEAT_FILE: "/tmp/worker_alive"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker_alive) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  extraction-worker:
    build: .
    container_name: apag-extraction-worker
    command: python worker_main.py
    environment:
      WORKER_STAGE: EXTRACT
      DATABASE_URL: postgresql://postgres:apag_secure_password_2026@postgres:5432/apag_knowledge_base
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: apag_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: apag_secure_password_2026
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: apag_admin
      MINIO_SECRET_KEY: apag_secure_password_2026
      MINIO_SECURE: "false"
      WORKER_POLL_INTERVAL_SECONDS: "1.0"
      SCAN_WORKER_LEASE_SECONDS: "60"
      WORKER_HEARTBEAT_FILE: "/tmp/worker_alive"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker_alive) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
